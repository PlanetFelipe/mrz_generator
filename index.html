<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRZ Test Data Generator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>MRZ Test Data Generator</h1>
    <button id="themeToggle" title="Toggle light/dark mode">Dark Mode</button>
  </div>

  <div class="row">
    <label class="required">Document Type:</label>
    <input id="docType" maxlength="1" value="P">
    <span class="hint">P is the default document type, change only if required.</span>
  </div>

  <div class="row">
    <label class="required">First Name:</label>
    <input id="firstName" value="JOHN">
  </div>

  <div class="row">
    <label class="required">Last Name:</label>
    <input id="lastName" value="SMITH">
  </div>

  <div class="row">
    <label class="required">Date of Birth:</label>
    <input id="dob" type="date" value="1990-01-01">
  </div>

  <div class="row">
    <label class="required">Passport Number:</label>
    <input id="passportNumber" maxlength="9" value="AB123456">
    <span class="hint">8 - 9 digits, including letters and numbers.</span>
  </div>

  <div class="row">
    <label class="required">Passport Expiry Date:</label>
    <input id="expiryDate" type="date" value="2030-01-01">
  </div>

  <div class="row">
    <label class="required">Country:</label>
    <input id="countryInput" list="countryList" autocomplete="off" placeholder="Type to search...">
    <datalist id="countryList"></datalist>
    <input type="hidden" id="country">
  </div>

  <div class="row">
    <label class="required">Gender:</label>
    <select id="gender">
      <option value="M">Male</option>
      <option value="F">Female</option>
      <option value="X">Unspecified</option>
    </select>
  </div>

  <div class="row">
    <label>Personal Number:</label>
    <input id="personalNumber" maxlength="14">
    <span class="hint">A personal identification number, not mandatory.</span>
  </div>

  <div class="error" id="errorMsg"></div>

  <div class="buttons">
    <button class="primary" id="generateBtn">Generate MRZ</button>
    <button id="randomBtn">Randomize Data</button>
    <button id="clearBtn">Clear</button>
  </div>

  <textarea id="mrzOutput" placeholder="MRZ (TD3, 2 lines x 44 chars) will appear here..."></textarea>
  <pre id="printArea" class="print-only"></pre>
  <div class="footer-btns">
    <button id="copyBtn">Copy to Clipboard</button>
    <button id="printBtn">Print</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
